name: Minishell CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'task/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. NORMINETTE
  # ─────────────────────────────────────────────
  norminette:
    name: 🔍 Norminette
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install norminette
        run: pip install norminette

      - name: Run norminette
        run: |
          echo "──────────────────────────────────────────"
          echo " Running norminette on src/ and includes/"
          echo "──────────────────────────────────────────"
          OUTPUT=$(norminette src/ includes/ 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Error"; then
            echo ""
            echo "❌ Norminette found errors. Fix them before merging."
            exit 1
          fi
          echo "✅ Norminette passed!"

  # ─────────────────────────────────────────────
  # 2. BUILD
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: norminette

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libreadline-dev

      - name: Build minishell
        run: |
          echo "──────────────────────────────────────────"
          echo " Building minishell..."
          echo "──────────────────────────────────────────"
          make -j$(nproc)

      - name: Verify binary
        run: |
          if [ ! -f ./minishell ]; then
            echo "❌ Binary 'minishell' not found after build!"
            exit 1
          fi
          echo "✅ Binary built successfully."
          ls -lh ./minishell

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: minishell-binary
          path: ./minishell
          retention-days: 3